worker_processes 1;
pid /home/relay-user/.local/share/codex-relay/nginx/nginx.pid;

events {
    worker_connections 128;
}

http {
    log_format relay '$time_iso8601 method=$request_method path=$uri route=$relay_route_label '
                     'status=$status upstream_status=$upstream_status '
                     'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /home/relay-user/.local/share/codex-relay/nginx/logs/access.log relay;

    client_max_body_size 64m;
    client_body_timeout 60s;
    client_body_temp_path /home/relay-user/.local/share/codex-relay/nginx/temp/client_body;
    proxy_temp_path /home/relay-user/.local/share/codex-relay/nginx/temp/proxy;
    fastcgi_temp_path /home/relay-user/.local/share/codex-relay/nginx/temp/fastcgi;
    uwsgi_temp_path /home/relay-user/.local/share/codex-relay/nginx/temp/uwsgi;
    scgi_temp_path /home/relay-user/.local/share/codex-relay/nginx/temp/scgi;
    send_timeout 3600s;
    gzip off;

    server {
        listen 127.0.0.1:18080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Dedicated client-key route: DeepSeek and GPT keep separate credentials.
        # Separate metadata log keeps personal requests out of the shared pool monitor.
        location /client/v1/ {
            if ($http_authorization = "") { return 401; }
            set $relay_route_label "client-key";
            access_log /home/relay-user/.local/share/codex-relay/nginx/logs/client-access.log relay;
            proxy_pass https://upstream-a.invalid/v1/;
            proxy_set_header Host upstream-a.invalid;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_server_name on;
            proxy_ssl_name upstream-a.invalid;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /v1/ {
            include /home/relay-user/.local/share/codex-relay/nginx/upstream-auth.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            return 404;
        }
    }
}
